name: Build PHP 7 Legacy Images
run-name: Build PHP 7 Legacy Images 7.0.34, 7.1.34, 7.2.35

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    name: Build PHP Image ${{ matrix.imageVersion }} (PHP ${{ matrix.phpVersion }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - phpVersion: "7.0.33"
            imageVersion: "7.0.34"
          - phpVersion: "7.1.33"
            imageVersion: "7.1.34"
          - phpVersion: "7.2.34"
            imageVersion: "7.2.35"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build PHP-FPM image and push
        uses: docker/build-push-action@v6
        with:
          context: php/${{ matrix.phpVersion }}
          file: php/${{ matrix.phpVersion }}/Dockerfile
          platforms: linux/amd64,linux/arm64/v8,linux/arm/v7
          push: true
          tags: 1panel/php:${{ matrix.imageVersion }}-fpm
          cache-from: type=gha,scope=php-legacy-${{ matrix.phpVersion }}
          cache-to: type=gha,mode=max,scope=php-legacy-${{ matrix.phpVersion }}
