name: Build PHP 7 Image
run-name: Build PHP 7 Image ${{ github.event.inputs.php74ImageVersion }}, ${{ github.event.inputs.php73ImageVersion }}

on:
  workflow_dispatch:
    inputs:
      buildPhp74:
        description: 'Build and publish PHP 7.4'
        type: boolean
        default: true
        required: false
      php74Version:
        description: 'Official PHP 7.4 base version (7.4.33)'
        default: '7.4.33'
        required: true
      php74ImageVersion:
        description: '1Panel maintenance image version (PHP remains 7.4.33)'
        default: '7.4.34'
        required: true
      buildPhp73:
        description: 'Also build and publish PHP 7.3'
        type: boolean
        default: true
        required: false
      php73Version:
        description: 'Official PHP 7.3 base version (7.3.33)'
        default: '7.3.33'
        required: true
      php73ImageVersion:
        description: '1Panel maintenance image version (PHP remains 7.3.33)'
        default: '7.3.34'
        required: true

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build PHP-7.4 and Push
        if: ${{ inputs.buildPhp74 }}
        uses: docker/build-push-action@v6
        with:
          context: php/7
          file: php/7/Dockerfile
          platforms: linux/amd64,linux/arm/v7,linux/arm64/v8,linux/s390x
          push: true
          build-args:
            PHP_VERSION=${{ github.event.inputs.php74Version }}
          tags: |
            1panel/php:${{ github.event.inputs.php74ImageVersion }}-fpm
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build PHP-7.3 and Push
        if: ${{ inputs.buildPhp73 }}
        uses: docker/build-push-action@v6
        with:
          context: php/7
          file: php/7/Dockerfile
          platforms: linux/amd64,linux/arm/v7,linux/arm64/v8,linux/s390x
          push: true
          build-args:
            PHP_VERSION=${{ github.event.inputs.php73Version }}
          tags: |
            1panel/php:${{ github.event.inputs.php73ImageVersion }}-fpm
          cache-from: type=gha
          cache-to: type=gha,mode=max
