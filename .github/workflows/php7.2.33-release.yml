name: Build PHP 7.2.33 Image

on:
  workflow_dispatch:
    inputs:
      php_version:
        description: 'PHP 7.2 Version'
        default: '7.2.33'
        required: true
      install_ext_version:
        description: 'install-php-extensions version'
        default: '2.8.5'
        required: true

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build PHP-7.2 and Push
        uses: docker/build-push-action@v5
        with:
          context: php/7.2.33
          file: php/7.2.33/Dockerfile
          platforms: linux/amd64,linux/arm/v7,linux/arm64/v8
          push: true
          build-args:
            PHP_VERSION=${{ github.event.inputs.php_version }}
            INSTALL_EXT_VERSION=${{ github.event.inputs.install_ext_version }}
          tags: |
            1panel/php:${{ github.event.inputs.php_version }}-fpm
          cache-from: type=gha
          cache-to: type=gha,mode=max