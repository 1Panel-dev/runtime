name: Build DeepSeek Harness Image

on:
  workflow_dispatch:
    inputs:
      dshVersion:
        description: "@deepseek-ai/dsh npm version"
        default: "0.1.1-rc.2"
        required: true
      platforms:
        description: "Platforms"
        default: "linux/amd64,linux/arm64"
        required: true
      pushLatest:
        description: "Push latest tag"
        default: "true"
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  IMAGE_NAME: 1panel/deepseek-harness

jobs:
  docker:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deepseek-harness/Dockerfile
          platforms: ${{ github.event.inputs.platforms }}
          push: true
          build-args: |
            DSH_VERSION=${{ github.event.inputs.dshVersion }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.event.inputs.dshVersion }}
          cache-from: type=gha,scope=deepseek-harness
          cache-to: type=gha,mode=max,scope=deepseek-harness

      - name: Push latest tag
        if: ${{ github.event.inputs.pushLatest == 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deepseek-harness/Dockerfile
          platforms: ${{ github.event.inputs.platforms }}
          push: true
          build-args: |
            DSH_VERSION=${{ github.event.inputs.dshVersion }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=deepseek-harness
          cache-to: type=gha,mode=max,scope=deepseek-harness
