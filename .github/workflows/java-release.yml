name: Build Java Image

on:
  workflow_dispatch:
    inputs:
      javaVersion:
        description: 'Java Version'
        default: '21'
        required: true
      javaVariant:
        description: 'Eclipse Temurin image variant'
        default: 'jdk-noble'
        required: true
      platforms:
        description: 'Platforms'
        default: 'linux/amd64,linux/arm64/v8'
        required: true
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build Java Image and Push
        uses: docker/build-push-action@v6
        with:
          context: java
          file: java/Dockerfile
          platforms: ${{ github.event.inputs.platforms }}
          push: true
          build-args: |
            JAVA_VERSION=${{ github.event.inputs.javaVersion }}
            JAVA_VARIANT=${{ github.event.inputs.javaVariant }}
          tags: |
            1panel/java:${{ github.event.inputs.javaVersion }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
