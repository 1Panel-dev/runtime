name: Build vLLM GB10 Dual Node Image
run-name: Build vLLM GB10 Dual Node Image ${{ inputs.imageVersion }}

on:
  workflow_dispatch:
    inputs:
      imageVersion:
        description: "Docker Hub image tag"
        default: "0.25-optimized-for-2-gb10-ds-v4-flash"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vllm-gb10-dual-node-release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  IMAGE_NAME: 1panel/vllm

jobs:
  docker:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Validate image version
        shell: bash
        env:
          IMAGE_VERSION: ${{ inputs.imageVersion }}
        run: |
          set -euo pipefail
          if [[ ! "${IMAGE_VERSION}" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid image version: ${IMAGE_VERSION}"
            exit 1
          fi

      - name: Build and push arm64 image
        uses: docker/build-push-action@v7
        with:
          context: vllm-gb10-dual-node
          file: vllm-gb10-dual-node/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            IMAGE_VERSION=${{ inputs.imageVersion }}
          tags: ${{ env.IMAGE_NAME }}:${{ inputs.imageVersion }}
          cache-from: type=gha,scope=vllm-gb10-dual-node
          cache-to: type=gha,mode=max,scope=vllm-gb10-dual-node
