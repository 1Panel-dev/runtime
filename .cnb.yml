main:
  web_trigger_build_node_image:
    - runner:
         tags: cnb:arch:amd64:containerd-snapshotter
      services:
        - docker
      imports: https://cnb.cool/1Panel-dev/secrets/-/blob/main/docker-1panel-envs.yml
      stages:
        - name: set docker tag
          script: echo -n "${DOCKER_REGISTRY}/${DOCKER_GROUP}/node:$NODE_VERSION"
          exports:
            info: IMAGE_TAG
        - name: docker login
          script: docker login -u ${DOCKER_USER} -p "${DOCKER_PWD}" ${DOCKER_REGISTRY}
          
        - name: docker build and push
          script: docker buildx build 
            --platform $PLATFORM 
            --build-arg NODE_VERSION=$NODE_VERSION 
            -t $IMAGE_TAG 
            -f node/Dockerfile 
            node/ 
            --push
  web_trigger_build_php_image:
    - runner:
        tags: cnb:arch:amd64:containerd-snapshotter
      services:
        - docker
      imports: https://cnb.cool/1Panel-dev/secrets/-/blob/main/docker-1panel-envs.yml
      stages:
        - name: set docker tag
          script: |
            image_version="${PHP_IMAGE_VERSION:-}"
            if [ -z "$image_version" ]; then
              case "$PHP_VERSION" in
                7.4.33) image_version=7.4.34 ;;
                8.0.30) image_version=8.0.31 ;;
                8.1.34) image_version=8.1.35 ;;
                *) image_version="$PHP_VERSION" ;;
              esac
            fi
            printf '%s' "${DOCKER_REGISTRY}/${DOCKER_GROUP}/php:${image_version}-fpm"
          exports:
            info: IMAGE_TAG
        - name: docker login
          script: docker login -u ${DOCKER_USER} -p "${DOCKER_PWD}" ${DOCKER_REGISTRY}

        - name: docker build and push
          script: docker buildx build
              --build-arg PHP_VERSION=$PHP_VERSION
              --platform $PLATFORM
              -t $IMAGE_TAG 
              -f php/$DIR/Dockerfile 
              php/$DIR/ 
              --push