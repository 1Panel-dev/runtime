branch:
  - buttons:
      - name: "编译 PHP 7.x 镜像"
        event: web_trigger_build_php_7_x_image
        permissions:
          roles:
            - owner
        inputs:
          PHP_VERSION:
            name: "PHP 版本"
            description: "PHP 版本"
            default: "7.2.34"
            required: true 
  - buttons: 
    - name: "编译 Node.js 镜像"
      event: web_trigger_build_node_image
      permissions:
        roles:
          - owner
      inputs:
        NODE_VERSION:
          name: "Node.js 版本"
          description: "Node.js 版本"
          default: "18.20.8"
          required: true
