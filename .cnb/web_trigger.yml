branch:
  - buttons:
      - name: "编译 PHP 镜像"
        event: web_trigger_build_php_image
        permissions:
          roles:
            - owner
        inputs:
          PHP_VERSION:
            name: "PHP 版本"
            description: "PHP 版本"
            default: "7.2.34"
            required: true
          DIR:
            name: "文件目录"
            description: "文件目录"
            default: "7.2.34"
            required: true
          PLATFORM:
            name: "编译平台"
            description: "编译平台，多个用逗号分隔"
            default: "linux/amd64,linux/arm64,linux/ppc64le,linux/s390x"
            required: true 
  - buttons: 
    - name: "编译 Node.js 镜像"
      event: web_trigger_build_node_image
      permissions:
        roles:
          - owner
      inputs:
        NODE_VERSION:
          name: "Node.js 版本"
          description: "Node.js 版本"
          default: "18.20.8"
          required: true
        PLATFORM:  
          name: "编译平台"
          description: "编译平台，多个用逗号分隔"
          default: "linux/amd64,linux/arm64,linux/ppc64le,linux/s390x"
          required: true